syntax = "proto3";

package user;

option java_package = "com.lafuente.test.grpcchallengelafuente.generated";
option java_multiple_files = true;

service UserService {
  rpc GetUser (GetUserRequest) returns (UserResponse);
  rpc GetUserActivityStream (GetUserRequest) returns (stream UserActivity);
}

message GetUserRequest {
  string user_id = 1;
}

message UserResponse {
  string user_id = 1;
  string name = 2;
  string email = 3;
}


message UserActivity {
  string timestamp = 1;
  string activity = 2;
}